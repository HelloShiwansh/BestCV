[theme]
base = "light"
primaryColor = "#7856B5"
backgroundColor = "#FCFAFF"
secondaryBackgroundColor = "#F1ECF9"
textColor = "#30283F"
font = "sans serif"

[server]
maxUploadSize = 5
enableXsrfProtection = false
enableCORS = false
headless = true

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "minimal"
